# 実際のトークンはこのファイルに書かず、クラスタ側で作る:
#
#   oc create secret generic search-mcp-auth \
#     --from-literal=tokens="$(openssl rand -hex 32)"
#
# 複数トークンをカンマ区切りで入れるとクライアントごとのローテーションができる:
#   --from-literal=tokens="<opencode-vm-token>,<agent-pod-token>"
# 片方を失効させたいときは、その値だけ消して Deployment を再起動する。
#
# 下はローカル検証用のダミー。kustomization.yaml からは参照していない。
apiVersion: v1
kind: Secret
metadata:
  name: search-mcp-auth
  labels:
    app.kubernetes.io/name: search-mcp
type: Opaque
stringData:
  tokens: "REPLACE_ME_WITH_A_RANDOM_TOKEN"
