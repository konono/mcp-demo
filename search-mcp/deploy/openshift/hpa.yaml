apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-mcp
  labels:
    app.kubernetes.io/name: search-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-mcp
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # 外部 API のレート制限を踏まないよう、縮退はゆっくり行う。
      stabilizationWindowSeconds: 300
