apiVersion: v1
kind: Service
metadata:
  name: search-mcp
  labels:
    app.kubernetes.io/name: search-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: search-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# クラスタ内の agent framework Pod からは
#   http://search-mcp.<namespace>.svc.cluster.local:8080/mcp
# で到達する。stateless_http なのでセッションアフィニティは不要
# （sessionAffinity: None のまま複数 replica に分散してよい）。
